# Netlify config — Fresh Market

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback - React Router obsługuje routing po stronie klienta
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Funkcje serwerowe (dla wysyłki maili itp.)
[functions]
  node_bundler = "esbuild"

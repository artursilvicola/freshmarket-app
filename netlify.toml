# Netlify config — Fresh Market

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# [B2B Round prod-rollout / custom-domain] Force 301 redirect z Netlify subdomain
# na primary domain b2b.freshmarket.eu. Netlify nie robi tego automatycznie dla
# domen poza Netlify DNS — musimy explicit. Wszystkie wejścia na *.netlify.app
# (np. stare bookmarki, linki w starych mailach) lądują na nowej domenie.
# force = true wymusza redirect nawet jeśli plik istnieje pod tą samą ścieżką.
[[redirects]]
  from = "https://freshmarketb2b.netlify.app/*"
  to = "https://b2b.freshmarket.eu/:splat"
  status = 301
  force = true

# SPA fallback - React Router obsługuje routing po stronie klienta
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Funkcje serwerowe (dla wysyłki maili itp.)
[functions]
  node_bundler = "esbuild"
  # [B2B Round prod-rollout / AI knowledge base]
  # Plik z bazą wiedzy dla GPT (asystent admina przy "Sformułuj odpowiedź AI").
  # Bez tego markdown nie trafia do bundle Netlify Functions i fs.readFileSync
  # rzuci ENOENT. Edycje pliku → commit → następna inwokacja funkcji czyta
  # świeżą wersję (Netlify rebuilduje funkcje przy każdym deployu).
  included_files = [
    "docs/PRECONNECT_KOMPENDIUM_DLA_GPT.md",
    "docs/FRESH_MARKET_EVENT_2026_KOMPENDIUM.md",
  ]
